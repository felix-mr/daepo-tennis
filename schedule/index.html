</style></head><body><main class="shell"><nav class="page-links"><a class="archive-back" href="../">← 날짜별 대진표</a><a class="archive-back" href="../records/">기록 · 순위 →</a><a class="archive-back" href="../builder/">대진표 만들기</a></nav><section id="live-status" class="score-connection" role="status">대진표 불러오는 중…</section><p id="schedule-delete-status" role="status" aria-live="polite"></p><section id="schedule-manage" class="schedule-manage" hidden><p>점수 입력 전인 대진만 삭제하고 다시 만들 수 있습니다.</p><button id="delete-schedule" class="danger-button" type="button">대진 삭제</button></section><div id="live-content" hidden></div></main><script type="module">const builderModel = (() => {
  const pad = n => String(n).padStart(2, '0');
  const minute = value => Number(value.slice(0, 2)) * 60 + Number(value.slice(3));
  const time = n => pad(Math.floor(n / 60)) + ':' + pad(n % 60);
  const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  function nextSaturday(day = today()) {
    const date = new Date(day + 'T00:00:00Z');
    date.setUTCDate(date.getUTCDate() + (6 - date.getUTCDay() + 7) % 7);
    return date.toISOString().slice(0, 10);
  }
  function validDate(day) {
    return /^\d{4}-\d{2}-\d{2}$/.test(day) && !Number.isNaN(Date.parse(day)) && new Date(day + 'T00:00:00Z').toISOString().slice(0, 10) === day;
  }
  const periodForDate = (day, periods) => Object.entries(periods).find(([, p]) => p.startsOn <= day && day < p.endsBefore)?.[0] || null;
  const name = value => String(value).normalize('NFC').trim().replace(/\s+/g, ' ');
  function validateName(value) {
    const normalized = name(value);
    if (!normalized || normalized.length > 24 || /[\u0000-\u001f\u007f]/.test(normalized)) throw Error('이름은 1~24자로 입력해 주세요.');
    return normalized;
  }
  function guestId(day, guests) {
    for (let i = 1; i <= 99; i++) {
      const id = 'guest-' + day + '-' + pad(i);
      if (!Object.hasOwn(guests, id)) return id;
    }
    throw Error('게스트를 더 추가할 수 없습니다.');
  }
  function allocate(ids, available, rounds = 6) {
    const capacity = Math.min(2, Math.floor(ids.length / 4)) * 4 * rounds;
    const target = Math.min(ids.length === 4 ? 3 : 4, Math.floor(capacity / ids.length));
    if (target < 2) throw Error('모두 2경기 이상 치를 수 있도록 참석 인원을 줄여 주세요.');
    if (ids.some(id => (available[id] ?? rounds) < 2)) throw Error('모두 두 타임 이상 참석할 수 있도록 시간을 맞춰 주세요.');
    const quotas = Object.fromEntries(ids.map(id => [id, Math.min(target, available[id] ?? rounds)]));
    let slots = Object.values(quotas).reduce((a, b) => a + b, 0);
    for (const id of [...ids].reverse()) {
      if (slots % 4 === 0) break;

        interrupt = () => reject(Error('인터넷 연결이 끊겼어요. 초안은 유지됩니다. 다시 연결한 뒤 확정해 주세요.'));
        timer = setTimeout(() => reject(Error('서버 확인이 지연되고 있어요. 초안은 유지됩니다. 다시 확정해 주세요.')), 20000);
        window.addEventListener('offline', interrupt, {once:true});
      });
      try { return await Promise.race([action(), stopped]); }
      finally { clearTimeout(timer); window.removeEventListener('offline', interrupt); }
    };
    await onlineStage(() => f.setDoc(draftRef, payload));
    const prove = proof => f.setDoc(f.doc(draftRef, 'validation', proof), { date: document.date, createdAt: f.serverTimestamp() });
    const stage = async proofs => {
      for (let start = 0; start < proofs.length; start += 4) await onlineStage(async () => {
        const results = await Promise.allSettled(proofs.slice(start, start + 4).map(prove));
        const failed = results.find(result => result.status === 'rejected');
        if (failed) throw failed.reason;
      });
    };
    await stage(['structure']);
    await stage([...Array.from({length:16},(_,i)=>'p'+(i+1)), ...Array.from({length:12},(_,i)=>'m'+(i+1)), 'l1', 'l2']);
    await stage(['players1','players2','matches1','matches2']);
    await stage(['roster','rounds','locks']);
    if (!navigator.onLine) throw Error('인터넷 연결 후 다시 확정해 주세요. 초안은 유지됩니다.');
    await f.runTransaction(db, async transaction => {
      const existing = await transaction.get(ref);
      if (existing.exists() && existing.data().sourceDraftId === draftRef.id) return;
      if (existing.exists()) { const error = Error('다른 사람이 먼저 이 날짜 대진을 확정했어요. 저장된 대진을 확인해 주세요.'); error.code = 'already-exists'; throw error; }
      transaction.set(ref, { ...payload, sourceDraftId: draftRef.id });
    });
    return document.date;
  }
  async function listen(config, success, failure) {
    const { f, db } = await connection(config);
    return f.onSnapshot(f.collection(db, 'schedules'), { includeMetadataChanges: true }, snapshot => {
      if (snapshot.metadata.hasPendingWrites || snapshot.metadata.fromCache) return;
      success(snapshot.docs.map(doc => doc.data()));
    }, failure);
  }
  async function watch(config, date, success, failure) {
    const { f, db } = await connection(config);
    return f.onSnapshot(f.doc(db, 'schedules', date), { includeMetadataChanges: true }, snapshot => {
      if (snapshot.metadata.hasPendingWrites || snapshot.metadata.fromCache) return;
      success(snapshot.exists() ? snapshot.data() : null);
    }, failure);
  }
  const removalError = (code, message) => Object.assign(Error(message), {code});
  async function removalStatus(config, date, sourceDraftId) {
    if (!builderModel.validDate(date) || !/^[a-zA-Z0-9]{20}$/.test(sourceDraftId || '')) throw removalError('invalid-schedule', '웹에서 확정한 대진만 삭제할 수 있습니다.');
    if (!navigator.onLine) throw removalError('offline', '인터넷 연결 후 삭제해 주세요.');
    const { f, db } = await connection(config);
    const parent = await f.getDocFromServer(f.doc(db, 'schedules', date));
    if (!parent.exists()) return {exists:false};
    if (parent.data().sourceDraftId !== sourceDraftId) throw removalError('schedule-changed', '대진이 새로 만들어졌어요. 최신 대진을 확인해 주세요.');
    const scores = await f.getDocsFromServer(f.query(f.collection(db, 'schedules', date, 'matchResults'), f.limit(1)));
    if (!scores.empty) throw removalError('has-results', '점수가 입력된 대진은 삭제할 수 없습니다. 기존 경기 기록을 유지합니다.');
    return {exists:true};
  }
  async function remove(config, date, sourceDraftId) {
    await removalStatus(config, date, sourceDraftId);
    const { f, db } = await connection(config), parent = f.doc(db, 'schedules', date);
    try { await f.runTransaction(db, async transaction => {
      const current = await transaction.get(parent);
      if (!current.exists()) return;
      if (current.data().sourceDraftId !== sourceDraftId) throw removalError('schedule-changed', '대진이 새로 만들어졌어요. 최신 대진을 확인해 주세요.');
      for (const part of ['rounds1','rounds2']) transaction.set(f.doc(db, 'scheduleDeletions', sourceDraftId, 'checks', part),
        {date,sourceDraftId,createdAt:f.serverTimestamp()});
      transaction.delete(parent);
    }); } catch(error) {
      if(error.code==='permission-denied')await removalStatus(config,date,sourceDraftId);
      throw error;
    }
    return date;
  }
  return { connection, read, save, listen, watch, removalStatus, remove };
})();

// The preflight explains eligibility; server rules recheck all results atomically.
const scheduleDeletion = (() => {
  function mount({config, getSchedule, onDeleted, onBusy = () => {}}) {
    const dialog = document.createElement('dialog');
    dialog.className = 'delete-dialog';
    dialog.setAttribute('aria-labelledby', 'delete-dialog-title');
    dialog.setAttribute('aria-describedby', 'delete-dialog-description');
    dialog.innerHTML = '<h2 id="delete-dialog-title">대진표를 삭제할까요?</h2><p id="delete-dialog-description">삭제하면 공유 링크에서 대진을 볼 수 없습니다. 같은 날짜로 다시 만들 수 있습니다. 점수가 입력된 대진은 삭제할 수 없습니다.</p><p class="delete-dialog-error" role="alert" hidden></p><div class="delete-dialog-actions"><button type="button" data-cancel-delete autofocus>취소</button><button type="button" data-confirm-delete class="danger-button">대진 삭제</button></div>';
    document.body.append(dialog);
    const cancel = dialog.querySelector('[data-cancel-delete]'), confirm = dialog.querySelector('[data-confirm-delete]'), error = dialog.querySelector('[role=alert]');
    let target = null, busy = false, submitting = false, opener, finished = false;
    const status = text => { const node=document.getElementById('schedule-delete-status'); if(node)node.textContent=text; };
    const setBusy = value => {busy=value;onBusy(value);};
    const failureMessage = failure => failure.code === 'permission-denied'
      ? '점수 입력 여부와 최신 대진을 다시 확인해 주세요. 삭제는 완료되지 않았습니다.'
      : failure.message || '삭제 확인에 실패했어요. 대진을 다시 확인해 주세요.';
    dialog.addEventListener('cancel', event => {if(submitting)event.preventDefault();});
    const restoreFocus=()=>{
      const next=[document.getElementById(opener?.id),document.getElementById('date'),document.querySelector('nav a')]
        .find(node=>node && !node.disabled && node.getClientRects().length);
      next?.focus();
    };
    dialog.addEventListener('close', () => {
      if(dialog.open)return;
      target=null;setBusy(false);
      if(finished){const next=document.querySelector('.deleted-action') || document.getElementById('generate');if(next && !next.disabled)next.focus();}
      else restoreFocus();
    });
    cancel.addEventListener('click', () => {if(!submitting)dialog.close();});
    confirm.addEventListener('click', async () => {
      if (!target || submitting) return;
      const submitted={...target};
      submitting=true;cancel.disabled=confirm.disabled=true;confirm.textContent='삭제 중…';error.hidden=true;
      try {
        await builderStore.remove(config,submitted.date,submitted.sourceDraftId);
        finished=true;dialog.close();status(submitted.date+' 대진표를 삭제했어요. 다시 만들 수 있습니다.');onDeleted(submitted);
      } catch (failure) {error.textContent=failureMessage(failure);error.hidden=false;}
      finally {submitting=false;cancel.disabled=confirm.disabled=false;confirm.textContent='대진 삭제';}
    });
    return {async open(button) {
      if(busy)return;
      const current=getSchedule();if(!current)return;
      const snapshot={date:current.date,sourceDraftId:current.sourceDraftId};opener=button;finished=false;setBusy(true);status('점수 입력 여부 확인 중…');
      try {
        const result=await builderStore.removalStatus(config,snapshot.date,snapshot.sourceDraftId);
        if(!result.exists){status('이미 삭제된 대진입니다. 다시 만들 수 있습니다.');setBusy(false);onDeleted(snapshot);return;}
        target=snapshot;dialog.querySelector('h2').textContent=snapshot.date+' 대진표를 삭제할까요?';error.hidden=true;status('');dialog.showModal();cancel.focus();
      } catch(failure){status(failureMessage(failure));setBusy(false);restoreFocus();}
    }};
  }
  return {mount};
})();


function startScores(config, day, scoreMatches, sourceDraftId) {
const resultModel = (() => {
  function outcome(scoreA, scoreB) {
    return scoreA > scoreB ? 'teamA' : scoreA < scoreB ? 'teamB' : 'draw';
  }

  function valid(record) {
    return record && /^\d{4}-\d{2}-\d{2}$/.test(record.date)
      && [record.scoreA, record.scoreB].every(score => Number.isInteger(score) && score >= 0 && score <= 99)
      && record.outcome === outcome(record.scoreA, record.scoreB)
      && Array.isArray(record.teamA) && Array.isArray(record.teamB)
      && record.teamA.length === 2 && record.teamB.length === 2
      && new Set([...record.teamA, ...record.teamB]).size === 4
      && [...record.teamA, ...record.teamB].every(id => typeof id === 'string')
      && (record.fixedPlayerIds === undefined || (Array.isArray(record.fixedPlayerIds)
        && new Set(record.fixedPlayerIds).size === record.fixedPlayerIds.length
        && record.fixedPlayerIds.every(id => [...record.teamA, ...record.teamB].includes(id))))
      && ['teamANames', 'teamBNames'].every(field => Array.isArray(record[field])
        && record[field].length === 2 && record[field].every(name => typeof name === 'string'))
      && Number.isInteger(record.round) && record.round >= 1 && record.round <= 6
      && [1, 2].includes(record.floor);
  }

  function aggregate(records, players = {}, { fixedOnly = false } = {}) {
    const stats = new Map(Object.entries(players).map(([id, profile]) =>
      [id, { id, name: profile.name, games: 0, wins: 0, draws: 0, losses: 0, points: 0, winRate: null }]));
    for (const record of records.filter(valid)) {
      for (const side of ['teamA', 'teamB']) {
        record[side].forEach((id, index) => {
          if (fixedOnly && Array.isArray(record.fixedPlayerIds) && !record.fixedPlayerIds.includes(id)) return;
          if (!stats.has(id)) stats.set(id, {
            id, name: record[`${side}Names`]?.[index] || id,
            games: 0, wins: 0, draws: 0, losses: 0, points: 0, winRate: null,
          });
          const row = stats.get(id);
          row.games += 1;
          if (record.outcome === 'draw') { row.draws += 1; row.points += 1; }
          else if (record.outcome === side) { row.wins += 1; row.points += 3; }
          else row.losses += 1;
          row.winRate = row.wins / row.games;
        });
      }
    }
    return stats;
  }

  function rank(records, players = {}) {
    return [...aggregate(records, players, { fixedOnly: true }).values()].sort((a, b) =>
      b.points - a.points || (b.winRate ?? -1) - (a.winRate ?? -1)
      || b.wins - a.wins || a.name.localeCompare(b.name, 'ko'));
  }

  function partners(records, playerId, players = {}) {
    const stats = new Map();
    for (const record of records.filter(valid)) {
      if (Array.isArray(record.fixedPlayerIds) && !record.fixedPlayerIds.includes(playerId)) continue;
      const side = record.teamA.includes(playerId) ? 'teamA' : record.teamB.includes(playerId) ? 'teamB' : null;
      if (!side) continue;
      const index = record[side].findIndex(id => id !== playerId);
      const id = record[side][index];
      if (!stats.has(id)) stats.set(id, {
        id, name: players[id]?.name || record[`${side}Names`][index],
        games: 0, wins: 0, draws: 0, losses: 0, points: 0, winRate: null, memberGames: 0,
        guestDate: /^guest-(\d{4}-\d{2}-\d{2})-/.exec(id)?.[1] || null,
      });
      const row = stats.get(id);
      row.games += 1;
      if (record.outcome === 'draw') { row.draws += 1; row.points += 1; }
      else if (record.outcome === side) { row.wins += 1; row.points += 3; }
      else row.losses += 1;
      if (record.fixedPlayerIds?.includes(id)) row.memberGames += 1;
      row.winRate = row.wins / row.games;
    }
    return [...stats.values()].sort((a, b) => b.games - a.games || b.winRate - a.winRate
      || a.name.localeCompare(b.name, 'ko') || a.id.localeCompare(b.id));
  }

  const rate = row => row?.games ? `${(row.winRate * 100).toFixed(1)}%` : '—';
  const summary = row => row
    ? `${row.games}경기 · ${row.wins}승 ${row.draws}무 ${row.losses}패 · 승률 ${rate(row)} · 승점 ${row.points}점`
    : '0경기 · 0승 0무 0패 · 승률 — · 승점 0점';
  return { outcome, valid, aggregate, rank, partners, rate, summary };
})();

const membershipModel = (() => {
  const periodForDate = (date, memberships) => Object.keys(memberships).find(id => {
    const period = memberships[id];
    return period.startsOn && period.endsBefore && period.startsOn <= date && date < period.endsBefore;
  }) || null;
  const memberIds = (period, memberships) => memberships[period]?.memberIds || [];
  function fixedPlayerIds(record, memberships) {
    const participants = [...(record.teamA || []), ...(record.teamB || [])];
    const members = Array.isArray(record.fixedPlayerIds)
      ? record.fixedPlayerIds : memberIds(periodForDate(record.date, memberships), memberships);
    return [...new Set(members)].filter(id => participants.includes(id));
  }
  const normalize = (record, memberships) => ({ ...record, fixedPlayerIds: fixedPlayerIds(record, memberships) });
  return { periodForDate, memberIds, fixedPlayerIds, normalize };
})();

const firebaseConfig = config;
const scheduleDate = day;
const matches = scoreMatches;
const memberships = {"current-members": {"label": "8~10월(임시)", "startsOn": "2026-08-01", "endsBefore": "2026-11-01", "memberIds": ["p001", "p002", "p003", "p004", "p005", "p006", "p007", "p008", "p009", "p010", "p011"]}};
const scoreEpoch = typeof sourceDraftId === 'string' ? sourceDraftId : null;
const forms = [...document.querySelectorAll('[data-score-form]')];
const connection = document.getElementById('score-connection-status');
const retry = document.getElementById('score-retry');
const saved = new Map();
const drafts = new Map();
const messages = new Map();
const saving = new Set();
let ready = false;
let db, firestore, unsubscribe, connectionTimer;
let modulesPromise;
let connectionGeneration = 0;

const version = record => record?.updatedAt
  ? `${record.updatedAt.seconds}:${record.updatedAt.nanoseconds}` : null;
const sameVersion = (left, right) => version(left) === version(right);

function setConnection(text, connected, canRetry = false) {
  connection.textContent = text;
  ready = connected && navigator.onLine;
  retry.hidden = !canRetry;
  renderAll();
}

function render(matchId) {
  const record = saved.get(matchId);
  const draft = drafts.get(matchId);
  forms.filter(form => form.dataset.match === matchId).forEach(form => {
    for (const field of ['scoreA', 'scoreB']) {
      const input = form.elements.namedItem(field);
      const value = draft ? draft[field] : record?.[field] ?? '';
      if (input.value !== String(value)) input.value = value;
      input.disabled = saving.has(matchId);
    }
    const reverse = form.dataset.reverse === 'true';
    const score = record
      ? `${record[reverse ? 'scoreB' : 'scoreA']} : ${record[reverse ? 'scoreA' : 'scoreB']}`
      : '미입력';
    form.querySelector('[data-score-result]').textContent = `저장된 점수 · ${score}`;
    let outcome = '';
    if (record) {
      if (record.outcome === 'draw') outcome = '무승부 · 승점 1점';
      else if (form.dataset.personalScore === 'true') {
        const won = record.outcome === (reverse ? 'teamB' : 'teamA');
        outcome = won ? '승리 · 승점 3점' : '패배 · 승점 0점';
      } else outcome = `${record[`${record.outcome}Names`].join(' · ')} 승 · 각 3점`;
    }
    form.querySelector('[data-score-outcome]').textContent = outcome;
    form.querySelector('[data-score-message]').textContent = messages.get(matchId) || '';
    const button = form.querySelector('[type="submit"]');
    button.disabled = !ready || saving.has(matchId) || !draft;
    button.textContent = saving.has(matchId) ? '저장 중…' : '점수 저장';
    form.querySelector('[data-reset-score]').hidden = !draft;
    form.querySelector('[data-reset-score]').disabled = saving.has(matchId);
  });
}

function renderAll() {
  Object.keys(matches).forEach(render);
}

function errorMessage(error) {
  if (error.code === 'permission-denied') return '점수 접근 권한을 확인해 주세요.';
  if (error.code === 'not-found' || error.code === 'failed-precondition') return '점수 저장소 설정을 확인해 주세요.';
  return '점수 연결 실패. 잠시 후 다시 연결해 주세요.';
}

async function connect() {
  const generation = ++connectionGeneration;
  clearTimeout(connectionTimer);
  unsubscribe?.();
  unsubscribe = undefined;
  setConnection('점수 연결 중…', false);
  connectionTimer = setTimeout(() => {
    setConnection('점수 연결이 지연되고 있어요. 다시 연결해 주세요.', false, true);
  }, 12000);
  try {
    modulesPromise ??= Promise.all([
      import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js'),
    ]).catch(error => { modulesPromise = undefined; throw error; });
    const [appModule, firestoreModule] = await modulesPromise;
    if (generation !== connectionGeneration) return;
    firestore = firestoreModule;
    db ??= firestore.getFirestore(appModule.initializeApp(firebaseConfig));
    const scores = firestore.collectionGroup(db, 'matchResults');
    unsubscribe = firestore.onSnapshot(scores, { includeMetadataChanges: true }, snapshot => {
      if (generation !== connectionGeneration) return;
      if (snapshot.metadata.hasPendingWrites) return;
      const previous = new Map(saved);
      saved.clear();
      const allRecords = [];
      snapshot.forEach(document => {
        const data = document.data();
        if (resultModel.valid(data)) {
          allRecords.push(membershipModel.normalize(data, memberships));
          if (data.date === scheduleDate && matches[document.id]) saved.set(document.id, data);
        }
      });
      const stats = resultModel.aggregate(allRecords, {}, { fixedOnly: true });
      const guestStats = resultModel.aggregate(allRecords.filter(record => record.date === scheduleDate));
      document.querySelectorAll('[data-player-summary]').forEach(node => {
        const fixed = node.dataset.memberStatus === 'fixed';
        node.textContent = `${fixed ? '고정 멤버 누적' : '이번 주 게스트 기록'} · ${resultModel.summary((fixed ? stats : guestStats).get(node.dataset.playerSummary))}`;
      });
      for (const [id, draft] of drafts) {
        if (!sameVersion(previous.get(id), saved.get(id)) && !saving.has(id)) {
          messages.set(id, '다른 사람이 점수를 수정했어요. 취소하면 최신 점수를 볼 수 있어요.');
        }
      }
      if (!snapshot.metadata.fromCache) clearTimeout(connectionTimer);
      setConnection(snapshot.metadata.fromCache ? '점수 연결 확인 중…' : '점수 공유 중 · 누구나 입력·수정 가능',
        !snapshot.metadata.fromCache, snapshot.metadata.fromCache);
    }, error => {
      if (generation !== connectionGeneration) return;
      clearTimeout(connectionTimer);
      setConnection(errorMessage(error), false, true);
    });
  } catch (error) {
    if (generation !== connectionGeneration) return;
    clearTimeout(connectionTimer);
    setConnection(errorMessage(error), false, true);
  }
}

forms.forEach(form => {
  const id = form.dataset.match;
  form.addEventListener('input', () => {
    const existing = drafts.get(id);
    drafts.set(id, {
      scoreA: form.elements.namedItem('scoreA').value,
      scoreB: form.elements.namedItem('scoreB').value,
      baseVersion: existing ? existing.baseVersion : version(saved.get(id)),
    });
    messages.set(id, '저장 전');
    render(id);
  });
  form.querySelector('[data-reset-score]').addEventListener('click', () => {
    drafts.delete(id);
    messages.delete(id);
    render(id);
  });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!ready || saving.has(id) || !drafts.has(id)) return;
    const draft = drafts.get(id);
    const scoreA = Number(draft.scoreA), scoreB = Number(draft.scoreB);
    if (draft.scoreA === '' || draft.scoreB === '' ||
        ![scoreA, scoreB].every(value => Number.isInteger(value) && value >= 0 && value <= 99)) {
      messages.set(id, '두 팀 점수를 0~99 정수로 입력해 주세요.');
      render(id);
      return;
    }
    saving.add(id);
    messages.set(id, '저장 중…');
    render(id);
    try {
      const reference = firestore.doc(db, 'schedules', scheduleDate, 'matchResults', id);
      await firestore.runTransaction(db, async transaction => {
        if(scoreEpoch) {
          const parent=await transaction.get(firestore.doc(db,'schedules',scheduleDate));
          if(!parent.exists() || parent.data().sourceDraftId!==scoreEpoch){
            const error=Error('Schedule changed while editing');error.code='schedule-changed';throw error;
          }
        }
        const current = await transaction.get(reference);
        const record = current.exists() ? current.data() : undefined;
        if (version(record) !== draft.baseVersion) {
          if (record) saved.set(id, record); else saved.delete(id);
          const error = new Error('Score changed while editing');
          error.code = 'score-conflict';
          throw error;
        }
        transaction.set(reference, { ...matches[id], scoreA, scoreB,
          ...(scoreEpoch ? {sourceDraftId:scoreEpoch} : {}),
          outcome: resultModel.outcome(scoreA, scoreB), updatedAt: firestore.serverTimestamp() });
      });
      // Show success only after the server acknowledged the transaction.
      const confirmed = await firestore.getDocFromServer(reference);
      saved.set(id, confirmed.data());
      drafts.delete(id);
      messages.set(id, '저장 완료');
    } catch (error) {
      messages.set(id, error.code === 'score-conflict'
        ? '다른 사람이 먼저 저장했어요. 취소 후 최신 점수를 확인해 주세요.'
        : error.code === 'schedule-changed' ? '대진이 삭제되거나 새로 만들어졌어요. 새로고침 후 최신 대진을 확인해 주세요.'
        : '저장 확인 실패. 입력값은 유지돼요. 연결 후 최신 점수를 확인해 주세요.');
    } finally {
      saving.delete(id);
      render(id);
    }

    const rest = doc.players.filter(id => !active.has(id) && r > doc.availability[id].from && r <= doc.availability[id].to);
    const ended = doc.players.filter(id => r > doc.availability[id].to);
    rounds += '<section class="round"><div class="round-time"><div class="round-num">ROUND ' + r + '</div><div class="clock">' + builderModel.time(450 + r * 30) + '</div><div class="clock-end">— ' + builderModel.time(480 + r * 30) + '</div></div>' + [1, 2].map(floor => { const match = row.find(m => m.floor === floor); return match ? matchCard(match) : '<article class="match"><div class="floor">' + floor + '층 코트</div><p>이 타임은 배정 없음</p></article>'; }).join('') + '<div class="round-rest">' + (rest.length ? '휴식 · ' + rest.map(id => escapeLive(doc.profiles[id].name)).join(' · ') : '참석 선수 모두 출전') + (ended.length ? ' / 종료 · ' + ended.map(id => escapeLive(doc.profiles[id].name)).join(' · ') : '') + '</div></section>';
  }
  document.getElementById('live-content').innerHTML = '<section class="lookup"><div class="lookup-head"><div><h2>대포클럽 · 내 대진 찾기</h2><p>' + escapeLive(doc.date) + ' · 선수 이름을 선택하세요.</p></div><button type="button" class="all-button" data-show-all>전체 대진표</button></div><label>선수<select id="live-player"><option value="">전체 대진</option>' + doc.players.map(id => '<option value="' + escapeLive(id) + '">' + escapeLive(doc.profiles[id].name) + '</option>').join('') + '</select></label></section><section class="score-connection"><p id="score-connection-status" role="status" aria-live="polite">점수 연결 중…</p><button id="score-retry" type="button" hidden>다시 연결</button></section><header class="hero"><div class="topline"><div class="eyebrow">' + escapeLive(theme.eyebrow) + '</div><button type="button" class="print" id="live-print">인쇄 / PDF 저장</button></div><h1>' + escapeLive(theme.title) + '<br><span class="accent">' + escapeLive(theme.accent) + '</span></h1>' + (theme.characterPortrait ? '<p class="concept-caption">' + escapeLive(theme.tagline) + '</p>' : '') + '<p class="subtitle">' + escapeLive(doc.date) + ' · 08:00–11:00 · 1층 / 2층 코트</p><div class="hero-bottom"><div class="hero-notes">' + doc.lockedPairs.map(entry => '<span class="hero-note">고정 페어 · ' + entry.players.map(id => escapeLive(doc.profiles[id].name)).join(' · ') + ' · ' + (entry.games === 'all' ? '전체 경기' : entry.games + '경기') + '</span>').join('') + '</div><div class="metrics"><div class="metric"><strong>' + doc.players.length + '</strong><span>참가 인원</span></div><div class="metric"><strong>6</strong><span>타임</span></div><div class="metric"><strong>' + matches.length + '</strong><span>경기</span></div></div></div>' + image + '</header><div id="full-schedule"><div class="section-head"><h2>경기 일정</h2><p>남복 ' + stats.types['남복'] + ' · 혼복 ' + stats.types['혼복'] + ' · 여복 ' + stats.types['여복'] + '</p></div>' + rounds + '</div><div id="personal-schedules" hidden>' + doc.players.map(personal).join('') + '</div>';
  const choose = id => {
    document.querySelector('.hero').hidden = !!id; document.getElementById('full-schedule').hidden = !!id; document.getElementById('personal-schedules').hidden = !id;
    document.querySelectorAll('[data-personal-id]').forEach(section => section.hidden = section.dataset.personalId !== id);
    document.getElementById('live-player').value = id;
    const url = new URL(location.href); if (id) url.searchParams.set('player', id); else url.searchParams.delete('player'); history.replaceState(null, '', url);
  };
  document.getElementById('live-player').addEventListener('change', e => choose(e.target.value));
  document.querySelectorAll('[data-show-all]').forEach(button => button.addEventListener('click', () => choose('')));
  document.getElementById('live-print').addEventListener('click', () => print());
  const wanted = new URL(location.href).searchParams.get('player'); if (doc.players.includes(wanted)) choose(wanted);
  document.getElementById('live-status').hidden = true; document.getElementById('live-content').hidden = false;
  const scoreMatches = Object.fromEntries(Object.entries(doc.matches).filter(([, match]) => match.fixedPlayerIds.length));
  startScores(liveData.firebaseConfig, doc.date, scoreMatches, doc.sourceDraftId);
}
async function load() {
  try {
    if (!builderModel.validDate(day)) throw Error('대진표 날짜를 확인해 주세요.');
    if (liveData.legacyDates.includes(day)) { location.replace('../' + day + '/'); return; }
    const doc = await builderStore.read(liveData.firebaseConfig, day);
    if (!doc) {showRemoved(day,false);return;}
    builderModel.validateDocument(doc, {preferences:false});
    const theme = liveData.themes[doc.theme] || liveData.themes.club;
    await new Promise((resolve, reject) => { const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = '../' + theme.stylesheet; link.onload = resolve; link.onerror = () => reject(Error('컨셉 화면을 불러오지 못했어요. 새로고침해 주세요.')); document.head.append(link); });
    mount(doc);
    document.getElementById('schedule-manage').hidden=false;
    document.getElementById('delete-schedule').disabled=!navigator.onLine;
    await builderStore.watch(liveData.firebaseConfig,day,current=>{
      if(!current){showRemoved(day);return;}
      if(current.sourceDraftId!==documentSchedule.sourceDraftId){
        document.getElementById('live-content').hidden=true;document.getElementById('schedule-manage').hidden=true;
        const status=document.getElementById('live-status');status.hidden=false;
        status.innerHTML='대진표가 새로 만들어졌어요.<br><a class="archive-back deleted-action" href="?date='+encodeURIComponent(day)+'">최신 대진 다시 보기 →</a>';
      }
    },()=>{const status=document.getElementById('live-status');status.hidden=false;status.textContent='대진 상태 연결이 끊겼어요. 새로고침해 주세요.';});
  } catch (error) { document.getElementById('live-status').textContent = error.code === 'permission-denied' ? '대진표 접근 권한을 확인해 주세요.' : error.message; }
}
load();
</script></body></html>
